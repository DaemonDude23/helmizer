name: Release
on:
  push:
    tags: ['v*']
  schedule:
    - cron: '43 10 1 * *'
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment (select an existing tag as ref to retry it)
        type: choice
        options: [patch, minor, major]
        default: patch
permissions:
  contents: read
concurrency:
  group: helmizer-release
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      skip: ${{ steps.plan.outputs.skip }}
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Require default branch history
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REF: ${{ github.ref }}
        run: |
          if [[ "$REF" != refs/tags/* ]]; then
            test "$REF" = "refs/heads/$DEFAULT_BRANCH"
          fi
      - id: plan
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REF: ${{ github.ref }}
          BUMP: ${{ inputs.bump || 'patch' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release-plan.py --ref "$REF" --bump "$BUMP" --default-branch "origin/$DEFAULT_BRANCH" --output "$GITHUB_OUTPUT"
          tag=$(sed -n 's/^tag=//p' "$GITHUB_OUTPUT" | tail -1)
          if [[ -n "$tag" ]]; then
            # A published release is immutable here; incomplete drafts are retried.
            gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > /tmp/releases.json
            if jq -e --arg tag "$tag" 'any(.[][]; .tag_name == $tag and .draft == false)' /tmp/releases.json >/dev/null; then
              echo 'skip=true' >> "$GITHUB_OUTPUT"
            fi
          fi
      - id: sha
        env:
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          if [[ -n "$TAG" ]] && git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            sha=$(git rev-list -n 1 "$TAG")
          else
            sha=$(git rev-parse HEAD)
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
  publish:
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
    env:
      TAG: ${{ needs.plan.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
      # renovate: datasource=go depName=golang.org/x/vuln
      GOVULNCHECK_VERSION: v1.1.4
      # renovate: datasource=github-releases depName=goreleaser/goreleaser
      GORELEASER_VERSION: v2.18.2
      # renovate: datasource=docker depName=docker.io/aquasec/trivy
      TRIVY_IMAGE: docker.io/aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.x'
          check-latest: true
          cache-dependency-path: src/go.sum
      - name: Prepare matching source version
        run: printf '%s\n' "${TAG#v}" > src/VERSION
      - name: Verify Go and vulnerability checks
        working-directory: src
        run: |
          go mod verify
          go vet ./...
          go test -race ./...
          go install golang.org/x/vuln/cmd/govulncheck@"${GOVULNCHECK_VERSION}"
          govulncheck ./...
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - name: Verify Nix package
        run: |
          nix build .#default --out-link "$RUNNER_TEMP/nix-release"
          test "$("$RUNNER_TEMP/nix-release/bin/helmizer" --version)" = "helmizer ${TAG#v}"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build and scan release images before registry login
        run: bash scripts/release-images.sh build-scan
      - name: Create or verify release tag
        run: |
          changed=$(git diff --name-only)
          [[ -z "$changed" || "$changed" = src/VERSION ]]
          git diff --cached --quiet
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            git diff --quiet
            test "$(git rev-list -n 1 "$TAG")" = "$(git rev-parse HEAD)"
          else
            # The only release edit is VERSION, committed on detached HEAD.
            # The tag carries it; no branch push or bypass of main protection.
            if ! git diff --quiet -- src/VERSION; then
              git add src/VERSION
              git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
                -c commit.gpgsign=false commit -m "Release $TAG"
            fi
            git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
              tag -a "$TAG" -m "$TAG"
            git push origin "refs/tags/$TAG"
          fi
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          args: release --clean
          version: ${{ env.GORELEASER_VERSION }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Push scanned images and versioned manifests
        run: bash scripts/release-images.sh push
      - name: Promote images and publish release
        run: |
          bash scripts/release-images.sh promote
          gh release edit "$TAG" --draft=false --latest
