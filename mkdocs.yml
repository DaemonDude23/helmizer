site_name: helmizer
site_description: Generates kustomization.yaml for your locally-rendered YAML manifests, such as with Helm templates
site_url: https://daemondude23.github.io/helmizer/
repo_url: https://github.com/DaemonDude23/helmizer
repo_name: DaemonDude23/helmizer
docs_dir: docs

# From the repository root:
#   nix run .#docs      live-reloading server at http://127.0.0.1:8000
#   nix build .#docs    strict static build (also part of `nix flake check`)
theme:
  name: material
  # No Google Fonts requests: the site works offline and leaks nothing.
  font: false
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Development: dev.md
  - CI and releases: automation.md
  - Diagrams: diagrams.md
  - Changelog: changelog.md
